services:
  - type: web
    name: ai-lecture-transcriber-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: FRONTEND_URL
        sync: false
      # JWT signing key for auth tokens. Without it every login / signup /
      # password reset returns 500. Set the value in the Render dashboard.
      - key: SECRET_KEY
        sync: false
      # Gemini API key used to generate MCQ assessments. Without it every
      # "Generate Assessment" request fails. Set the value in the Render dashboard.
      - key: GEMINI_API_KEY
        sync: false
