name: Keep Supabase and Render awake

on:
  schedule:
    # 4x/day, evenly spaced (UTC)
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          if [ -z "${{ vars.RENDER_BACKEND_URL }}" ]; then
            echo "RENDER_BACKEND_URL repo variable is not set. Set it in Settings > Actions > Variables."
            exit 1
          fi
          # Render free tier cold-starts after 15 min idle (can take 30-60s+),
          # so retry with a generous per-attempt timeout instead of failing outright.
          curl -sf --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            "${{ vars.RENDER_BACKEND_URL }}/api/health"
